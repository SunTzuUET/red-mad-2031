<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RED-MAD 2031 · Demanda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="noc.css">
<link rel="stylesheet" href="demanda.css">
</head>
<body class="m-ref">
<header class="tb barra">
  <div class="tb-f">
    <span class="marca-red">RED-MAD 2031<small>NOC · 5G + FTTH</small></span><span class="sep"></span>
    <div class="modo" role="group" aria-label="Modo">
      <button type="button" data-modo="ref" aria-pressed="true"><span data-t="m_ref">Referencia · Entrega 2 (v7)</span></button>
      <button type="button" data-modo="lab" aria-pressed="false"><span data-t="m_lab">Laboratorio</span></button>
    </div>
    <span class="rotulo-modo" id="rotulo-modo"></span>
    <nav class="tabs dem-nav"><a class="tab" href="index.html" data-t="volver">Mapa</a><span class="tab" aria-selected="true" data-t="titulo">Demanda</span></nav>
    <div class="esp"></div>
    <div class="ctl"><span class="rot" data-t="anio">Año</span><input type="range" id="anio" min="2025" max="2031" step="1" value="2031"><span id="anio-v" class="mono">2031</span></div>
    <button class="btn" id="reset" data-t="reset">Restablecer parámetros</button>
    <div class="seg" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
  </div>
</header>
<main>
  <p class="intro" data-t="intro"></p>

  <section class="bloque">
    <h2 data-t="resumen">Resumen</h2>
    <div class="fichas" id="fichas"></div>
    <div class="control" id="control"></div>
  </section>

  <section class="bloque">
    <h2 data-t="explorador">¿De dónde sale cada cifra?</h2>
    <div class="explorador">
      <div class="panel"><h3 data-t="pasos">Cadena de cálculo</h3><div class="arbol" id="arbol"></div></div>
      <div class="panel detalle" id="detalle"></div>
      <div class="panel"><h3 data-t="parametros">Parámetros editables</h3><div class="params" id="params"></div></div>
    </div>
  </section>

  <section class="bloque">
    <h2 data-t="modelos">Modelos de tráfico</h2>
    <p class="intro" data-t="modelos_intro"></p>
    <div class="ctl" style="margin:10px 0;flex-wrap:wrap;gap:8px 16px">
      <label><span data-t="dia">Tipo de día</span> <select id="sel-dia" class="btn"></select></label>
      <label><span data-t="ambito">Ámbito</span> <select id="sel-ambito" class="btn"></select></label>
    </div>
    <div class="modelos">
      <div>
        <div class="panel grafica" id="modelos-graf"></div>
        <div class="panel" style="margin-top:12px"><h3 data-t="tabla_modelos">Resumen por modelo</h3><div class="tabla-wrap"><table class="t" id="tabla-modelos"></table></div></div>
      </div>
      <div class="panel desc-modelo" id="desc-modelos"></div>
    </div>
  </section>

  <section class="bloque">
    <h2 data-t="municipios">Reparto por municipio</h2>
    <p class="intro" data-t="municipios_intro"></p>
    <div class="panel tabla-wrap" style="margin-top:10px"><table class="t" id="municipios"></table></div>
    <p class="nota" data-t="nota_mun"></p>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="red.js"></script>
<script src="demanda_datos.js"></script>
<script src="modelo_demanda.js"></script>
<script src="modelos.js"></script>
<script src="motor.js"></script>
<script src="demanda.js"></script>
</body>
</html>
