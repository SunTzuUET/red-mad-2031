<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Madrid 2031</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="simple.css">
</head>
<body>
<!-- App mínima (CONTRATO_UI Revisión 15). La app completa sigue en completo.html. -->
<header class="barra">
  <b class="marca">Red Madrid 2031</b>
  <nav class="tabs" role="tablist">
    <button role="tab" data-vista="red" data-t="red">Red</button>
    <button role="tab" data-vista="simular" data-t="simular">Simular</button>
    <button role="tab" data-vista="cambiar" data-t="cambiar">Cambiar</button>
  </nav>
  <span class="hueco"></span>
  <a class="completo" href="completo.html" data-t="completo">Modo completo ↗</a>
  <span class="idioma"><button data-lang="es">ES</button><button data-lang="en">EN</button></span>
</header>
<main class="lienzo">
  <div id="mapa" class="mapa"></div>
  <div class="arriba">
    <div class="chips" role="group"></div>
    <button class="info" aria-label="info">i</button>
    <div class="info-txt" hidden></div>
  </div>
  <div class="estado"><span class="estado-txt"></span><span class="leyenda"></span></div>
  <div class="tarjeta" hidden></div>
  <div class="reloj" hidden>
    <button class="play" aria-label="play">▶</button>
    <input class="hora" type="range" min="0" max="23" step="1" value="21">
    <span class="hora-txt mono">21:00</span>
    <button class="cortar" data-t="cortar">Cortar enlace</button>
    <button class="restaurar" data-t="restaurar">Restaurar</button>
  </div>
  <div class="curva" hidden></div>
  <aside class="panel" hidden></aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="red.js"></script>
<script src="modelo_demanda.js"></script>
<script src="modelos.js"></script>
<script src="emplazamientos_datos.js"></script>
<script src="motor.js"></script>
<script src="simple.js"></script>
</body>
</html>
